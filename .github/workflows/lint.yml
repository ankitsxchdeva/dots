# Lint every script the dotfiles ship. These scripts mostly run on fresh
# machines (bootstrap/install) where breakage would otherwise go unnoticed
# until the worst possible moment.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts + hooks
        run: |
          shellcheck -S warning ./*.sh git/hooks/pre-commit \
            claude/.claude/hooks/* claude/.claude/statusline.sh
      - name: zsh syntax check
        run: |
          sudo apt-get install -y --no-install-recommends zsh >/dev/null
          zsh -n zsh/.zshrc zsh/.zprofile

  typecheck-pi-extensions:
    # The pi extensions are TypeScript loaded at runtime by pi — a type error
    # would only surface as a broken live session. Catch it here instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  claude-mirrors-in-sync:
    # claude/.claude/{commands,skills} are generated from their canonical pi/
    # sources by sync-claude-pi.sh — fail if someone edits one side only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./sync-claude-pi.sh --check
