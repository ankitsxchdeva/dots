unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"   # truecolor for the colophon-night palette

# split panes using | and - (open in the current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# quality-of-life
set -g mouse on
set -g base-index 1                # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on         # keep window numbers gap-free
set -g history-limit 50000
set -sg escape-time 10             # no lag for <Esc> in vim
set -g focus-events on
setw -g mode-keys vi               # vi-style copy mode
set -g set-clipboard on

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# reload config
bind r source-file ~/.tmux.conf \; display-message "  ~/.tmux.conf reloaded"

# fzf session switcher (replaces the stock choose-tree; needs tmux >= 3.2)
bind s display-popup -E -w 60% -h 50% "tmux list-sessions -F '#S' | fzf --reverse --prompt='session  ' | xargs -r tmux switch-client -t"

# ─── colophon-night theme ────────────────────────────────────────────
# ground: bg #1e1c22  raised #2a2733  dim #413f54   ink: fg #e8e4f4
# accent: wisteria #8b87c8  cyan #9db8dc   data: green #7fb98a  yellow #d9a85c
set -g pane-border-style 'fg=#2a2733'
set -g pane-active-border-style 'fg=#9db8dc'
setw -g mode-style 'fg=#1e1c22 bg=#9db8dc bold'
set -g message-style 'fg=#9db8dc bg=#2a2733 bold'

set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1e1c22 fg=#e8e4f4'
set -g status-left-length 40
set -g status-right-length 80

# session name in a frost "pill" on the left
set -g status-left '#[fg=#1e1c22,bg=#9db8dc,bold]  #S #[fg=#9db8dc,bg=#1e1c22]'

# date + time on the right
set -g status-right '#[fg=#413f54,bg=#1e1c22]#[fg=#e8e4f4,bg=#2a2733]  %a %d %b #[fg=#9db8dc,bg=#2a2733]#[fg=#1e1c22,bg=#9db8dc,bold]  %H:%M '

setw -g window-status-separator ''
setw -g window-status-current-format '#[fg=#1e1c22,bg=#8b87c8]#[fg=#1e1c22,bg=#8b87c8,bold] #I #W#{?window_zoomed_flag, ,} #[fg=#8b87c8,bg=#1e1c22]'
setw -g window-status-format '#[fg=#413f54,bg=#1e1c22]  #I #W  '
setw -g window-status-bell-style 'fg=#1e1c22 bg=#d9a85c bold'
