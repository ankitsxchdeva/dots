# lazygit — colophon-night config.  Stowed to ~/.config/lazygit/config.yml
# (lazygit finds it there because $XDG_CONFIG_HOME=~/.config — see ~/.zprofile).
# Schema reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
#
# colophon-night palette (from ghostty/ghostty/themes/colophon-night)
#   Ground    bg #1e1c22  raised #2a2733  selection #35334a  dim #413f54
#   Ink       muted #6e6a85  fg #e8e4f4  bright #f5f4fa
#   Accent    wisteria #8b87c8  deep #6f6bb0  cyan #9db8dc  bright cyan #b8cde9
#   Data      red #d97066  orange #e0916d  yellow #d9a85c  green #7fb98a  orchid #b184c9

gui:
  # ─── colophon-night theme ────────────────────────────────────────────
  theme:
    activeBorderColor:               ['#9db8dc', bold]   # cyan — focused panel
    inactiveBorderColor:             ['#413f54']         # dim plum — unfocused
    searchingActiveBorderColor:      ['#d9a85c', bold]   # yellow while searching
    optionsTextColor:                ['#8b87c8']         # wisteria — bottom keybind hints
    selectedLineBgColor:             ['#2a2733']         # selection highlight
    inactiveViewSelectedLineBgColor: ['#35334a']         # dimmer selection when unfocused
    cherryPickedCommitFgColor:       ['#9db8dc']         # copied (cherry-picked) commit
    cherryPickedCommitBgColor:       ['#35334a']
    markedBaseCommitFgColor:         ['#d9a85c']         # marked base commit (rebase)
    markedBaseCommitBgColor:         ['#35334a']
    unstagedChangesColor:            ['#d97066']         # red — unstaged
    defaultFgColor:                  ['#e8e4f4']         # foreground — default text

  # All commit authors in wisteria; matches the prompt/fzf accent.
  authorColors:
    '*': '#8b87c8'

  # Color branches by purpose (key is a regex matched against the branch name).
  branchColorPatterns:
    '^(main|master)$':         '#7fb98a'   # green — the trunk
    '^(feat|feature)/':        '#9db8dc'   # cyan — features
    '^(fix|hotfix|bug)/':      '#d97066'   # red   — fixes
    '^(chore|docs|refactor)/': '#b184c9'   # orchid — housekeeping

  nerdFontsVersion: "3"        # FiraCode Nerd Font is installed (Brewfile)
  showFileIcons: true
  showFileTree: true           # tree view of changed files (toggle with `)
  border: rounded              # matches the rounded fzf border
  filterMode: fuzzy            # fuzzy filtering, like fzf
  showRandomTip: false         # no tip clutter in the status line
  showCommandLog: false        # hide the bottom command-log pane for a cleaner UI
  showDivergenceFromBaseBranch: arrowAndNumber   # ↑3↓1 ahead/behind in branch list
  scrollHeight: 2
  skipDiscardChangeWarning: false

# ─── Diffs through delta (ANSI), same as the git pager in ~/.gitconfig ───
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --line-numbers --syntax-theme=ansi
  mainBranches: [main, master]
  parseEmoji: true             # render :emoji: in commit messages

disableStartupPopups: true     # don't nag on first launch / version bumps
